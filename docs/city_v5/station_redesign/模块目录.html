const DATA=window.STATION_CATALOG,nav=document.getElementById('nav'),content=document.getElementById('content'),select=document.getElementById('mobile-select');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const figure=(src,label)=>`<figure class="image-card"><a href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(label)}" loading="lazy"></a><figcaption>${esc(label)}<span>点击查看原图</span></figcaption></figure>`;
let active='overall';
function show(id){active=id;select.value=id;for(const button of nav.querySelectorAll('button'))button.classList.toggle('active',button.dataset.id===id);if(id==='overall')showOverall();else showModule(DATA.modules.find(m=>m.id===id));window.scrollTo({top:0,behavior:'instant'});for(const img of content.querySelectorAll('img'))img.onerror=()=>{const note=document.createElement('div');note.className='missing';note.textContent='此视图尚未到位';img.replaceWith(note);};}
function showOverall(){content.innerHTML=`<div class="article-head"><div><div class="eyebrow">晴岚港交通门户</div><h2>${esc(DATA.title)}</h2><p>先看建筑体量、入口轴线与构建关系，再进入各个模块。</p></div><div><span class="chip">${DATA.modules.length} 种模块</span><span class="chip">${DATA.modules.reduce((n,m)=>n+m.reuseCount,0)} 件计划拼装</span></div></div><div class="process"><div><strong>01 · 确认整体</strong><p>先核对站房比例、街道尺度和主入口。</p></div><div><strong>02 · 选择模块</strong><p>看同一物件的立体图、四视图和连接位置。</p></div><div><strong>03 · Tripo 制作</strong><p>每次生成一个完整构建单元，保持统一风格。</p></div><div><strong>04 · 检查与拼装</strong><p>校正尺寸、洞口和接口，再导入游戏验证。</p></div></div><p class="footer-note" style="margin:0 0 22px">建议制作顺序：${DATA.recommendedOrder.map(id=>esc(DATA.modules.find(m=>m.id===id)?.label||id)).join(' → ')}。</p><div class="overall-grid">${DATA.overall.map(v=>figure(v.src,v.label)).join('')}</div><p class="footer-note">这些图是新车站设计参考。模块生成后的拓扑、尺度、贴图与碰撞仍需检查，不能把预览图视为已经完成的游戏资产。</p>`;}
function showModule(m){if(!m)return;content.innerHTML=`<div class="article-head"><div><div class="eyebrow">${esc(m.id)}</div><h2>${esc(m.label)}</h2><p>完整构建单元 · 统一风格 · 按接口复用</p></div><div><span class="chip">计划使用 ${m.reuseCount} 件</span><span class="chip">五视图参考</span></div></div><div class="gallery">${figure(m.images.hero,m.label+' · 立体参考')}<div class="ortho-grid">${[['front','正面'],['right','右侧'],['back','背面'],['top','俯视']].map(([key,label])=>figure(m.images[key],label)).join('')}</div></div><div class="info-grid"><div><h3>结构与接口设计尺寸</h3><div class="dimensions">${m.dimensions.map(esc).join(' × ')} <small>m</small></div><p>宽 × 高 × 深<br>按接口面与开间节距校准</p><p style="margin-top:10px">含外挑的渲染外包：<br>${m.actualDimensions.length?m.actualDimensions.map(esc).join(' × ')+' m':'以实际视图测量为准'}<br>包含檐口、底座与装饰</p></div><div><h3>复用与范围</h3><p>计划拼装 ${m.reuseCount} 件。<br>每次只生成这一模块；不要连带周围建筑、地面或其他模块。</p></div><div><h3>接口与制作重点</h3><ul>${[...m.interfaces,...m.notes].map(line=>`<li>${esc(line)}</li>`).join('')||'<li>以四视图和整体拼装关系为准，保持接合面平整与洞口畅通。</li>'}</ul></div></div><section class="prompt-panel"><div class="prompt-head"><div><h3>英文 Tripo 提示</h3><p>与本模块视图一起使用；不调用任何生成服务。</p></div><button id="copy-prompt">复制提示</button></div><textarea id="prompt" readonly aria-label="英文 Tripo 提示"></textarea></section><p class="footer-note">建议先以立体图作主要参考；如果当前 Tripo 界面支持多图，再加入其余方向。米制尺寸是拼装目标，不能替代生成后的测量与校正；不要将含外挑的整体外包强行缩到名义开间尺寸。</p>`;document.getElementById('prompt').value=m.prompt;document.getElementById('copy-prompt').onclick=async()=>{const button=document.getElementById('copy-prompt');try{await navigator.clipboard.writeText(m.prompt);button.textContent='已复制';}catch{const field=document.getElementById('prompt');field.focus();field.select();button.textContent=document.execCommand('copy')?'已复制':'已选中，请按 Ctrl+C';}};}
