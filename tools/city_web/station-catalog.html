<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴岚港 · 新车站模块目录</title><style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#173440;background:#eef1ec;--ink:#173440;--gold:#b59456;--muted:#7b8c89;--line:#d5dfd8}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #cad8ce;border-radius:6px;padding:9px 14px;background:#f9fbf6;color:#3c6054}button:hover{background:#e3eee2}a{color:#416f5d}header{height:94px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#f6f8f2}h1,h2,h3,p{margin:0}.brand{display:flex;align-items:center;gap:16px}.mark{font:30px serif;border:1px solid #abc1ac;border-radius:50%;width:52px;height:52px;display:grid;place-items:center;color:#507459}.brand h1{font-size:22px;font-weight:550;letter-spacing:3px}.brand p{font-size:10px;color:#849585;letter-spacing:2px;margin-top:7px}.header-note{text-align:right;font-size:10px;color:#849384;line-height:1.8}main{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 94px)}aside{padding:25px 20px;border-right:1px solid var(--line);background:#f4f7ef;position:sticky;top:0;height:100vh;overflow-y:auto}.eyebrow{font-size:10px;letter-spacing:2px;color:#849481;text-transform:uppercase;margin-bottom:12px}.nav-button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:13px 11px;text-align:left;margin-bottom:5px}.nav-button:hover{border-color:#d3e0d0}.nav-button.active{background:#e1ecde;border-color:#9eba9e}.nav-number{font:12px Georgia,serif;color:#8aa28a;width:27px}.nav-copy{min-width:0}.nav-copy strong{display:block;font-size:12px;font-weight:500;color:#345745}.nav-copy span{display:block;font-size:10px;color:#8b9b8a;margin-top:5px}aside .note{font-size:11px;color:#879482;line-height:1.85;margin:26px 10px}article{padding:32px 36px 50px;max-width:1600px;width:100%;margin:auto}.article-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:25px}.article-head h2{font-size:30px;font-weight:450;letter-spacing:1px}.article-head p{font-size:11px;color:#849583;margin-top:10px}.chip{display:inline-block;font-size:10px;color:#557355;border:1px solid #bbcebb;padding:5px 8px;border-radius:4px;margin-left:5px;white-space:nowrap}.gallery{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);gap:20px}.image-card{border:1px solid #d2ded3;background:#fff;border-radius:8px;overflow:hidden;margin:0}.image-card>a{display:block;background:#f0f2ee}.image-card img{display:block;width:100%;aspect-ratio:1.38;object-fit:contain;background:#edf0e9}.image-card figcaption{display:flex;justify-content:space-between;padding:11px 14px;font-size:11px;color:#6b806c;border-top:1px solid #e3eae0}.image-card figcaption span{font-size:9px;color:#9aaa97}.ortho-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ortho-grid img{aspect-ratio:1.34}.ortho-grid figcaption{padding:8px 10px;font-size:10px}.info-grid{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:26px;margin-top:28px;padding-top:23px;border-top:1px solid #cddacc}.info-grid h3{font-size:12px;font-weight:550;color:#41694c;margin-bottom:12px}.info-grid p,.info-grid li{font-size:12px;line-height:1.9;color:#70856f}.info-grid ul{margin:0;padding-left:16px}.dimensions{font:24px Georgia,serif;letter-spacing:1px;color:#3d6446;margin:4px 0 8px}.dimensions small{font:11px sans-serif;letter-spacing:0;color:#879b84}.prompt-panel{margin-top:27px;background:#f7faf2;border:1px solid #cfdeca;border-radius:9px;padding:21px 24px}.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.prompt-head h3{font-size:14px;font-weight:500}.prompt-head p{font-size:10px;color:#8b9a84;margin-top:5px}.prompt-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.prompt-head button{background:#244c38;color:#f1f8ee;border-color:#244c38;font-size:11px}.prompt-panel textarea{display:block;width:100%;resize:vertical;min-height:220px;border:0;outline:none;background:none;color:#5b765c;font:12px/1.8 "Segoe UI",sans-serif}.footer-note{font-size:10px;line-height:1.8;color:#8e9d87;margin-top:22px}.overall-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.overall-grid .image-card:first-child{grid-column:1/-1}.overall-grid .image-card:first-child img{aspect-ratio:1.9}.process{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0 30px}.process>div{padding:17px 18px;border:1px solid #d0deca;border-radius:7px;background:#f6f9f0}.process strong{font-size:12px;font-weight:500;color:#527657;display:block;margin-bottom:8px}.process p{font-size:11px;color:#81937b;line-height:1.8}.missing{padding:45px 20px;color:#9e8970;text-align:center;font-size:12px;line-height:1.8}#mobile-select{display:none}.baseline{font-size:9px;color:#a1ad98;word-break:break-all;margin-top:17px}.source-link{font-size:10px}@media(max-width:1180px){main{grid-template-columns:230px minmax(0,1fr)}aside{padding:22px 14px}article{padding:28px 24px}.gallery{grid-template-columns:1fr}.ortho-grid{grid-template-columns:repeat(4,1fr)}.info-grid{gap:16px}.article-head h2{font-size:26px}.process{grid-template-columns:1fr 1fr}}@media(max-width:760px){header{height:82px;padding:0 18px}.header-note{display:none}.brand h1{font-size:18px}.mark{width:40px;height:40px;font-size:24px}main{display:block}aside{display:none}article{padding:20px 15px}.article-head{align-items:flex-start;gap:10px}.article-head h2{font-size:24px}.article-head .chip{margin:0 2px 5px;padding:4px 6px;font-size:9px}.ortho-grid{grid-template-columns:1fr 1fr}.info-grid{grid-template-columns:1fr 1fr}.info-grid>div:last-child{grid-column:1/-1}.overall-grid{grid-template-columns:1fr;gap:15px}.overall-grid .image-card:first-child{grid-column:auto}.overall-grid .image-card:first-child img{aspect-ratio:1.38}.prompt-panel{padding:18px 15px}#mobile-select{display:block;margin:15px;width:calc(100% - 30px);padding:11px;border:1px solid #bbd0b5;border-radius:7px;background:#f8faf4;color:#456d4c;font:inherit;font-size:12px}.process{gap:10px}.process>div{padding:13px}.brand p{letter-spacing:1px;font-size:9px}}
</style></head><body><header><div class="brand"><span class="mark">晴</span><div><h1>晴岚港 · 新车站</h1><p>整体设计 · 模块拆解 · TRIPO 制作</p></div></div><div class="header-note">先确认完整站房，再逐件制作<br>此目录尚未调用 Tripo 或替换游戏资产</div></header><select id="mobile-select" aria-label="选择视图或模块"></select><main><aside><div class="eyebrow">设计与构建目录</div><div id="nav"></div><p class="note">每件模块是可独立制作和复用的完整构建单元。窗、柱与檐口保留在所属开间内，避免零件过碎。</p><a class="source-link" href="Tripo逐模块提示.md">查看完整提示文档</a><div id="baseline" class="baseline"></div></aside><article id="content"></article></main><script>/* STATION_CATALOG_DATA */</script><script>
const DATA=window.STATION_CATALOG,nav=document.getElementById('nav'),content=document.getElementById('content'),select=document.getElementById('mobile-select');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const figure=(src,label)=>`<figure class="image-card"><a href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(label)}" loading="lazy"></a><figcaption>${esc(label)}<span>点击查看原图</span></figcaption></figure>`;
let active='overall';
function show(id){active=id;select.value=id;for(const button of nav.querySelectorAll('button'))button.classList.toggle('active',button.dataset.id===id);if(id==='overall')showOverall();else showModule(DATA.modules.find(m=>m.id===id));window.scrollTo({top:0,behavior:'instant'});for(const img of content.querySelectorAll('img'))img.onerror=()=>{const note=document.createElement('div');note.className='missing';note.textContent='此视图尚未到位';img.replaceWith(note);};}
function showOverall(){content.innerHTML=`<div class="article-head"><div><div class="eyebrow">晴岚港交通门户</div><h2>${esc(DATA.title)}</h2><p>先看建筑体量、入口轴线与构建关系，再进入各个模块。</p></div><div><span class="chip">${DATA.modules.length} 种模块</span><span class="chip">${DATA.modules.reduce((n,m)=>n+m.reuseCount,0)} 件计划拼装</span></div></div><div class="process"><div><strong>01 · 确认整体</strong><p>先核对站房比例、街道尺度和主入口。</p></div><div><strong>02 · 选择模块</strong><p>看同一物件的立体图、四视图和连接位置；结合爆炸图确认归属。</p></div><div><strong>03 · Tripo 制作</strong><p>每次生成一个完整外观构件；楼梯和入口坡道优先原生重建。</p></div><div><strong>04 · 检查与拼装</strong><p>在Blender中加入场地、站台、轨道与精确骨架，再验证通行。</p></div></div><p class="footer-note" style="margin:0 0 22px">建议制作顺序：${DATA.recommendedOrder.map(id=>esc(DATA.modules.find(m=>m.id===id)?.label||id)).join(' → ')}。</p><div class="overall-grid">${DATA.overall.map(v=>figure(v.src,v.label)).join('')}</div><p class="footer-note">这11种模块不包含场地、站台、轨道与精确承重骨架，这些部分后续在Blender中按标高、轨距和接口组装。M07双跑楼梯与M09台阶/缓坡建议直接原生重建，也可用Tripo探索石材与表面方案。模块的拓扑、尺度、贴图与碰撞仍需检查；这些设计参考尚未替换游戏资产。</p>`;}
function showModule(m){if(!m)return;content.innerHTML=`<div class="article-head"><div><div class="eyebrow">${esc(m.id)}</div><h2>${esc(m.label)}</h2><p>${['M07_stair_gallery','M09_entry_steps'].includes(m.id)?'精确土木件 · 建议原生重建 · Tripo可探索表面方案':'完整构建单元 · 统一风格 · 按接口复用'}</p></div><div><span class="chip">计划使用 ${m.reuseCount} 件</span><span class="chip">五视图参考</span></div></div><div class="gallery">${figure(m.images.hero,m.label+' · 立体参考')}<div class="ortho-grid">${[['front','正面'],['right','右侧'],['back','背面'],['top','俯视']].map(([key,label])=>figure(m.images[key],label)).join('')}</div></div><div class="info-grid"><div><h3>结构与接口设计尺寸</h3><div class="dimensions">${m.dimensions.map(esc).join(' × ')} <small>m</small></div><p>宽 × 高 × 深<br>按接口面与开间节距校准</p><p style="margin-top:10px">含外挑的渲染外包：<br>${m.actualDimensions.length?m.actualDimensions.map(esc).join(' × ')+' m':'以实际视图测量为准'}<br>包含檐口、底座与装饰</p></div><div><h3>复用与范围</h3><p>计划拼装 ${m.reuseCount} 件。<br>每次只生成这一模块；不要连带周围建筑、地面或其他模块。</p></div><div><h3>接口与制作重点</h3><ul>${[...m.interfaces,...m.notes].map(line=>`<li>${esc(line)}</li>`).join('')||'<li>以四视图和整体拼装关系为准，保持接合面平整与洞口畅通。</li>'}</ul></div></div><section class="prompt-panel"><div class="prompt-head"><div><h3>英文 Tripo 提示</h3><p>与本模块视图一起使用；不调用任何生成服务。</p></div><div class="prompt-actions"><button id="copy-prompt">复制提示</button><button id="select-prompt">选择全文</button></div></div><textarea id="prompt" readonly aria-label="英文 Tripo 提示"></textarea><p id="copy-status" class="footer-note" aria-live="polite">若直接复制未生效，点击「选择全文」，再按 Ctrl+C（Mac：⌘C）。</p></section><p class="footer-note">建议先以立体图作主要参考；如果当前 Tripo 界面支持多图，再加入其余方向。米制尺寸是拼装目标，不能替代生成后的测量与校正；不要将含外挑的整体外包强行缩到名义开间尺寸。</p>`;document.getElementById('prompt').value=m.prompt;document.getElementById('select-prompt').onclick=()=>{const field=document.getElementById('prompt');field.focus();field.select();document.getElementById('copy-status').textContent='已选中全部英文提示，请按 Ctrl+C（Mac：⌘C）复制。';};document.getElementById('copy-prompt').onclick=async()=>{const button=document.getElementById('copy-prompt');try{await navigator.clipboard.writeText(m.prompt);button.textContent='已复制';}catch{const field=document.getElementById('prompt');field.focus();field.select();button.textContent=document.execCommand('copy')?'已复制':'已选中，请按 Ctrl+C';}};}
nav.innerHTML=`<button class="nav-button" data-id="overall"><span class="nav-number">◎</span><span class="nav-copy"><strong>整体设计视图</strong><span>体量、尺度与拼装关系</span></span></button>`+DATA.modules.map((m,i)=>`<button class="nav-button" data-id="${esc(m.id)}"><span class="nav-number">${String(i+1).padStart(2,'0')}</span><span class="nav-copy"><strong>${esc(m.label)}</strong><span>${m.dimensions.map(esc).join(' × ')} m · ${m.reuseCount} 件</span></span></button>`).join('');for(const button of nav.querySelectorAll('button'))button.onclick=()=>show(button.dataset.id);select.innerHTML='<option value="overall">整体设计视图</option>'+DATA.modules.map(m=>`<option value="${esc(m.id)}">${esc(m.label)}</option>`).join('');select.onchange=()=>show(select.value);document.getElementById('baseline').textContent='清单基线 '+DATA.manifestSha256.slice(0,16);show('overall');
</script></body></html>
